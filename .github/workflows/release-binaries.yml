name: Release Binaries (Fork)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04
          - target: x86_64-apple-darwin
            os: macos-13
          - target: aarch64-apple-darwin
            os: macos-14

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install Rust toolchain
        uses: dsherret/rust-toolchain-file@v1

      - name: Add Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config lld
          if [[ "${{ matrix.target }}" == "aarch64-unknown-linux-gnu" ]]; then
            sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
          fi

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          ./tools/install_prebuilt.js ld64.lld
          echo "$GITHUB_WORKSPACE/third_party/prebuilt/mac" >> $GITHUB_PATH
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build Deno
        run: cargo build --profile release-lite --locked --bin deno --target ${{ matrix.target }}
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
          CXX_aarch64_unknown_linux_gnu: aarch64-linux-gnu-g++

      - name: Check Binary
        if: matrix.target != 'aarch64-unknown-linux-gnu'
        run: |
          ./target/${{ matrix.target }}/release-lite/deno --version
          ./target/${{ matrix.target }}/release-lite/deno eval "console.log(1+2)"

      - name: Package Binary
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release-lite
          zip -j deno-${{ matrix.target }}.zip deno
          shasum -a 256 deno-${{ matrix.target }}.zip > deno-${{ matrix.target }}.zip.sha256

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/${{ matrix.target }}/release-lite/deno-${{ matrix.target }}.zip
            target/${{ matrix.target }}/release-lite/deno-${{ matrix.target }}.zip.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
